packages:
  - ./cdk
  - ./app
  - ./app/cdk
  - ./cdk/function

allowBuilds:
  '@swc/core': false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - pnpm@12.20.0

overrides:
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  uuid@<14.0.0: '>=14.0.0'

trustPolicy: no-downgrade
